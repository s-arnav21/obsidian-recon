version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: obsidian_password
      POSTGRES_DB: obsidian_recon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
